name: Rebuild Kernelcaches (Safe - No Cleanup)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Device type'
        required: true
        default: 'ipad'
        type: choice
        options:
          - ipad
          - iphone

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Run extraction script
        run: |
          echo "Extracting ${{ github.event.inputs.filter }} kernelcaches from Apple IPSW..."
          python3 scripts/rebuild_kernelcaches.py \
            --filter "${{ github.event.inputs.filter }}" \
            --min-version "15.7" \
            --max-version "16.6.1"

      - name: Upload to release (--clobber overwrites matching files)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILTER="${{ github.event.inputs.filter }}"
          DIR="output"
          TAG="${FILTER}-kernelcache"

          # Get current asset count
          CURRENT_COUNT=$(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null || echo 0)
          echo "Current assets in release: $CURRENT_COUNT"

          NEW_COUNT=$(find "$DIR" -name "*.kernelcache" -type f | wc -l)
          echo "Files to upload: $NEW_COUNT"

          # Check 1000 limit
          if [ $((CURRENT_COUNT + NEW_COUNT)) -gt 1000 ]; then
            # Count how many are truly new (not already in release)
            EXISTING=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null)
            TRULY_NEW=0
            for f in $(find "$DIR" -name "*.kernelcache" -type f -printf '%f\n' | sort); do
              if ! echo "$EXISTING" | grep -qFx "$f"; then
                TRULY_NEW=$((TRULY_NEW + 1))
              fi
            done
            echo "Truly new files: $TRULY_NEW"
            if [ $((CURRENT_COUNT + TRULY_NEW)) -gt 1000 ]; then
              echo "ERROR: Would exceed 1000 asset limit ($CURRENT_COUNT + $TRULY_NEW = $((CURRENT_COUNT + TRULY_NEW)))"
              echo "Need to split releases. Stopping."
              exit 1
            fi
          fi

          # Ensure release exists
          if ! gh release view "$TAG" &>/dev/null; then
            echo "Creating release: $TAG"
            gh release create "$TAG" --title "${FILTER^} Kernelcaches" --notes "Rebuilt kernelcache files for TrollInstallerX."
          fi

          # Upload all with --clobber (overwrites existing, adds new)
          cd "$DIR"
          find . -name "*.kernelcache" -type f | sort | while read f; do
            echo "  Uploading $(basename "$f")..."
            gh release upload "$TAG" "$f" --clobber
          done

          # Upload index
          if [ -f index.json ]; then
            cp index.json "index_${FILTER}.json"
            echo "  Uploading index_${FILTER}.json..."
            gh release upload "$TAG" "index_${FILTER}.json" --clobber
          fi

          echo "Done!"
