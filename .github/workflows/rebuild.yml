name: Download Kernelcaches

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Download target'
        required: true
        default: 'ipad'
        type: choice
        options:
          - cleanup-only
          - ipad
          - iphone
          - all
      min_version:
        description: 'Min version (e.g. 15.7)'
        required: true
        default: '15.7'
      max_version:
        description: 'Max version (e.g. 16.6.1)'
        required: true
        default: '16.6.1'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Cleaning up all releases..."
          gh release list -L 9999 --json tagName | jq -r '.[].tagName' | while read tag; do
            echo "  Deleting $tag..."
            gh release delete "$tag" --yes --cleanup-tag
          done
          echo "All old releases deleted!"

  download-ipad:
    needs: cleanup
    if: ${{ github.event.inputs.filter == 'ipad' || github.event.inputs.filter == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Run extraction script
        run: |
          echo "Extracting iPad kernelcaches from Apple IPSW..."
          echo "Version range: ${{ github.event.inputs.min_version }} - ${{ github.event.inputs.max_version }}"
          python3 scripts/rebuild_kernelcaches.py \
            --filter ipad \
            --min-version "${{ github.event.inputs.min_version }}" \
            --max-version "${{ github.event.inputs.max_version }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="output"
          FILE_COUNT=$(find "$DIR" -name "*.kernelcache" -type f | wc -l)
          echo "Uploading $FILE_COUNT iPad kernelcache files..."

          gh release create "ipad-kernelcache" \
            --title "iPad Kernelcaches" \
            --notes "iPad kernelcache files (iPadOS ${{ github.event.inputs.min_version }}-${{ github.event.inputs.max_version }}). Extracted from Apple IPSW via appledb. Total: $FILE_COUNT files."

          cd "$DIR"
          find . -name "*.kernelcache" -type f | sort | while read f; do
            FILENAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "  Uploading $FILENAME ($SIZE)..."
            gh release upload "ipad-kernelcache" "$f" --clobber
          done

          if [ -f index.json ]; then
            cp index.json index_ipad.json
            echo "  Uploading index_ipad.json..."
            gh release upload "ipad-kernelcache" index_ipad.json --clobber
          fi

          echo "iPad upload complete!"
