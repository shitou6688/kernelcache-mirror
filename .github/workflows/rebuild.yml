name: Download Kernelcaches

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Download target'
        required: true
        default: 'ipad'
        type: choice
        options:
          - ipad
          - iphone
          - all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old releases..."
          gh release list -L 9999 --json tagName | jq -r '.[].tagName' | while read tag; do
            echo "  Deleting $tag..."
            gh release delete "$tag" --yes --cleanup-tag
          done
          echo "All old releases deleted!"

  download-ipad:
    needs: cleanup
    if: ${{ github.event.inputs.filter == 'ipad' || github.event.inputs.filter == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download iPad kernelcaches from Kami
        run: python3 scripts/mirror_kernelcaches.py --filter ipad

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="output/ipad-kernelcache"
          FILE_COUNT=$(find "$DIR" -name "*.kernelcache" -type f | wc -l)
          echo "Uploading $FILE_COUNT iPad kernelcache files..."

          gh release create "ipad-kernelcache" \
            --title "iPad Kernelcaches" \
            --notes "iPad kernelcache files (iPadOS 15.7.2-16.6.1). Total: $FILE_COUNT files."

          cd "$DIR"
          find . -name "*.kernelcache" -type f | sort | while read f; do
            FILENAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "  Uploading $FILENAME ($SIZE)..."
            gh release upload "ipad-kernelcache" "$f" --clobber
          done

          if [ -f index.json ]; then
            cp index.json index_ipad.json
            echo "  Uploading index_ipad.json..."
            gh release upload "ipad-kernelcache" index_ipad.json --clobber
          fi

          echo "iPad upload complete!"

  download-iphone:
    needs: cleanup
    if: ${{ github.event.inputs.filter == 'iphone' || github.event.inputs.filter == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download iPhone kernelcaches from Kami
        run: python3 scripts/mirror_kernelcaches.py --filter iphone

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="output/iphone-kernelcache"
          FILE_COUNT=$(find "$DIR" -name "*.kernelcache" -type f | wc -l)
          echo "Uploading $FILE_COUNT iPhone kernelcache files..."

          gh release create "iphone-kernelcache" \
            --title "iPhone Kernelcaches" \
            --notes "iPhone kernelcache files (iOS 15.7.2-16.6.1). Total: $FILE_COUNT files."

          cd "$DIR"
          find . -name "*.kernelcache" -type f | sort | while read f; do
            FILENAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "  Uploading $FILENAME ($SIZE)..."
            gh release upload "iphone-kernelcache" "$f" --clobber
          done

          if [ -f index.json ]; then
            cp index.json index_iphone.json
            echo "  Uploading index_iphone.json..."
            gh release upload "iphone-kernelcache" index_iphone.json --clobber
          fi

          echo "iPhone upload complete!"
