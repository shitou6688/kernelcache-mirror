name: Rebuild Kernelcaches

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Device filter (ipad or iphone)'
        required: true
        default: 'ipad'
        type: choice
        options:
          - ipad
          - iphone
      min_version:
        description: 'Min iOS/iPadOS version (e.g. 15.7)'
        required: true
        default: '15.7'
      max_version:
        description: 'Max iOS/iPadOS version (e.g. 16.6.1)'
        required: true
        default: '16.6.1'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Run extraction script
        run: |
          echo "Filter: ${{ github.event.inputs.filter }}"
          echo "Version range: ${{ github.event.inputs.min_version }} - ${{ github.event.inputs.max_version }}"
          python3 scripts/rebuild_kernelcaches.py \
            --filter ${{ github.event.inputs.filter }} \
            --min-version "${{ github.event.inputs.min_version }}" \
            --max-version "${{ github.event.inputs.max_version }}"

      - name: Prepare release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.filter }}-kernelcache"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "No existing release to delete"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "${{ github.event.inputs.filter == 'ipad' && 'iPad' || 'iPhone' }} Kernelcaches"
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FILE_COUNT=$(find output -name "*.kernelcache" -type f | wc -l)
          echo "Uploading $FILE_COUNT kernelcache files..."

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Auto-rebuilt from Apple IPSW (appledb). Version range: ${{ github.event.inputs.min_version }}-${{ github.event.inputs.max_version }}. Total: $FILE_COUNT files."

          cd output
          find . -name "*.kernelcache" -type f | sort | while read f; do
            FILENAME=$(basename "$f")
            SIZE=$(du -h "$f" | cut -f1)
            echo "  Uploading $FILENAME ($SIZE)..."
            gh release upload "$TAG" "$f" --clobber
          done

          if [ -f index.json ]; then
            INDEX_NAME="index_${{ github.event.inputs.filter }}.json"
            cp index.json "$INDEX_NAME"
            echo "  Uploading $INDEX_NAME..."
            gh release upload "$TAG" "$INDEX_NAME" --clobber
          fi

          echo "Upload complete!"
