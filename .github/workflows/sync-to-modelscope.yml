name: Sync to ModelScope (No LFS)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Sync kernel files to ModelScope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_PASSWORD }}
        run: |
          set -e
          
          # Clone ModelScope repo
          echo "Cloning ModelScope repo..."
          GIT_LFS_SKIP_SMUDGE=1 git clone "https://oauth2:${MS_TOKEN}@www.modelscope.cn/datasets/qwer1234561476/jumo.git" ms-repo
          cd ms-repo
          
          # KILL LFS completely
          echo "Removing LFS..."
          rm -f .gitattributes
          git lfs uninstall --local 2>/dev/null || true
          
          # Create target dir
          mkdir -p neihewenjian
          
          # Download all kernels from our release
          cd ..
          echo "Downloading kernels..."
          gh release download iphone-kernelcache -R shitou6688/kernelcache-mirror -D ms-repo/neihewenjian --pattern "*.kernelcache" --clobber
          gh release download ipad-kernelcache -R shitou6688/kernelcache-mirror -D ms-repo/neihewenjian --pattern "*.kernelcache" --clobber
          
          cd ms-repo
          FILE_COUNT=$(find neihewenjian -name "*.kernelcache" | wc -l)
          echo "Total files: $FILE_COUNT"
          
          # Commit and push
          git config user.name "shitou6688"
          git config user.email "shitou6688@users.noreply.github.com"
          git add neihewenjian/
          git commit -m "Kernel files ($FILE_COUNT files)" || echo "No changes to commit"
          
          # Push with retry
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git push 2>&1; then
              echo "Push OK!"
              break
            else
              echo "Push failed, retry in 10s..."
              sleep 10
            fi
          done
          
          echo "Done! $FILE_COUNT files synced"
